<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .counter {
        width: 350px;
        padding: 40px;
        text-align: center;
        background: white;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
        margin-bottom: 25px;
    }

    #count {
        font-size: 60px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #eeeeee;
    }

    button:hover {
        background: #dddddd;
    }
</style>
</head>

<body>

    <div class="counter">
        <h1>Counter</h1>

        <div id="count">0</div>

        <div class="buttons">
            <button id="decrease">−</button>
            <button id="reset">Reset</button>
            <button id="increase">+</button>
        </div>
    </div>

<script>
    const count = document.querySelector("#count");
    const buttons = document.querySelector(".buttons");
    let value = 0;

    buttons.addEventListener("click", (e) => {
        if (e.target.matches("#increase")) {
            ++value;

            count.textContent = value;
        } else if (e.target.matches("#decrease")) {
            --value;

            count.textContent = value;
        } else if (e.target.matches("#reset")) {
            value = 0;

            count.textContent = value;
        }
    });

    document.addEventListener("keydown", (e) => {
        if (e.key === "=") {
            ++value;

            count.textContent = value;
        } else if (e.key === "-") {
            --value;

            count.textContent = value;
        } else if (e.key === "Enter") {
            value = 0;

            count.textContent = value;
        }
    });
</script>
</body>
</html>
