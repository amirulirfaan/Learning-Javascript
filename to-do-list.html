<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .todo-container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #task-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #add-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #task-list {
            list-style: none;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-bottom: 10px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        .task.completed span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-buttons {
            display: flex;
            gap: 8px;
        }

        .complete-btn,
        .delete-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .complete-btn {
            background: #d6f5d6;
            transition: transform 0.3s ease;
        }

        .complete-btn:hover {
            background: #89ee89;
            transform: translateY(-2px);
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        .delete-btn {
            background: #ffd6d6;
            transition: transform 0.3s ease;
        }

        .delete-btn:hover {
            background: #ffb9b9;
            transform: translateY(-2px);
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="todo-container">
        <h1>My Tasks</h1>

        <div class="input-area">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a task"
            >
            <button id="add-btn">Add</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script>
        const taskInput = document.querySelector("#task-input"); 
        const addBtn = document.querySelector("#add-btn");

        const tasklist = document.querySelector("#task-list");

        let allTask = [];

        function renderTask() {
            tasklist.innerHTML = "";

            allTask.forEach((task, index) => { 
                const li = document.createElement("li");
                li.classList.add("task");
                li.classList.toggle("completed", task.completed);
                tasklist.appendChild(li);

                const span = document.createElement("span");
                span.textContent = task.taskname;
                
                const newDiv = document.createElement("div");
                newDiv.classList.add("task-buttons");
                li.append(span, newDiv);
                
                const doneBtn = document.createElement("button");
                doneBtn.classList.add("complete-btn");
                doneBtn.textContent = "Done";
                doneBtn.dataset.index = index;

                const delBtn = document.createElement("button");
                delBtn.classList.add("delete-btn");
                delBtn.textContent = "Delete";
                delBtn.dataset.index = index;

                newDiv.append(doneBtn, delBtn);
            });
        }

        addBtn.addEventListener("click", () => {
            addTask();
        });

        taskInput.addEventListener("keydown", (e) => {
           if (e.key === "Enter") {
                addTask();
           }
        });

        tasklist.addEventListener("click", (e) => {
            if (e.target.matches(".delete-btn")) {

                const deleteId = Number(e.target.dataset.index);

                allTask.splice(deleteId, 1);

                renderTask();
            } else if (e.target.matches(".complete-btn")) {
                
                const completedId = Number(e.target.dataset.index);

                allTask[completedId].completed = !allTask[completedId].completed;

                renderTask();
            }
        });

        function addTask() {
            const taskname = taskInput.value.trim();

                if (taskname) {

                    const task = {
                        taskname: taskname,
                        completed: false
                    }

                    allTask.push(task);

                    taskInput.value = "";

                    renderTask();
                }
        }
    </script>

</body>
</html>
