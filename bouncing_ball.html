<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bouncing Ball</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .container {
            width: 600px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        #playground {
            position: relative;
            width: 100%;
            height: 300px;
            border: 2px solid #222;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        #ball {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #222;
            left: 0;
            top: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #speed {
            flex: 1;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Bouncing Ball</h1>

        <div id="playground">
            <div id="ball"></div>
        </div>

        <div class="controls">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="1" max="10" value="5">
        </div>

        <div class="controls">
            <button id="start-btn">Start</button>
            <button id="stop-btn">Stop</button>
            <button id="reset-btn">Reset</button>
        </div>

    </div>

<script>
let positionX = 0;
let positionY = 0;
let directionX = 1;
let directionY = 1;

const ball = document.querySelector("#ball");
const startbtn = document.querySelector("#start-btn");
const stopbtn = document.querySelector("#stop-btn");
const resetbtn = document.querySelector("#reset-btn");
const playground = document.querySelector("#playground");
const maxHeight = playground.clientHeight - ball.offsetHeight;
const maxWidth = playground.clientWidth - ball.offsetWidth;
const range = document.querySelector("#speed");
let intervalID;
let speed = 5;
let isRunning = false;


startbtn.addEventListener("click", () => {
    if (isRunning) {
        return;
    }

    isRunning = true ;
    intervalID = setInterval(() => {
        if (positionY >= maxHeight) {
            directionY = -1;
        } 
        
        if (positionY <= 0) {
            directionY = 1;
        }

        if (positionX >= maxWidth) {
            directionX = -1;
        }

        if (positionX <= 0) {
            directionX = 1;
        }

        positionX += directionX * speed;
        ball.style.left = positionX + "px";
        positionY += directionY * speed;
        ball.style.top = positionY + "px";
    }, 10);
});

stopbtn.addEventListener("click", () => {
    isRunning = false;
    clearInterval(intervalID);
});

resetbtn.addEventListener("click", () => {
    isRunning = false;
    positionX = 0;
    positionY = 0;

    ball.style.left = positionX + "px";
    ball.style.top = positionY + "px";

    clearInterval(intervalID);
});

range.addEventListener("input", () => {
    speed = Number(range.value);
});

</script>

</body>
</html>
