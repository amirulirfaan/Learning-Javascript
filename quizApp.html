<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .quiz-container {
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        #question {
            margin-bottom: 20px;
        }

        #answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .answer-btn {
            padding: 12px;
            text-align: left;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .answer-btn:hover {
            background: #f1f1f1;
        }

        #next-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        #score {
            margin-top: 20px;
        }

        .correct-answer {
            padding: 12px;
            text-align: left;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            background: #90EE90; 
        }
        
        .wrong-answer {
            padding: 12px;
            text-align: left;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            background: #FFCCCB; 
        }

        .checkQuestion {
            display: none;
            width: fit-content;
            margin-bottom: 15px;
            padding: 8px 12px;

            background: #fff1f2;
            color: #be123c;

            border: 1px solid #fecdd3;
            border-radius: 8px;

            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1>JavaScript Quiz</h1>

        <h2 id="question"></h2>

        <div id="answers"></div>

        <span class="checkQuestion">Please Answer the Question Before Continue</span>

        <button id="next-btn">Next</button>

        <p id="score"></p>

    </div>

<script>
const questions = [
    {
        question: "What does map() return?",
        answers: [
            "The original array",
            "A new array",
            "A single value",
            "Nothing"
        ],
        correct: "A new array",
        answered: false
    },
    {
        question: "Which method adds an element to the end of an array?",
        answers: [
            "push()",
            "pop()",
            "shift()",
            "unshift()"
        ],
        correct: "push()",
        answered: false
    },
    {
        question: "Which keyword declares a variable that cannot be reassigned?",
        answers: [
            "let",
            "var",
            "const",
            "static"
        ],
        correct: "const",
        answered: false
    }
];

const theQuestion = document.querySelector("#question");
const theAnswer = document.querySelector("#answers");
const nextbtn = document.querySelector("#next-btn");
const score = document.querySelector("#score");
const checkQuestion = document.querySelector(".checkQuestion");

let currentQuestion = 1;
let currentScore = 0;

function renderQuestion() {
    if (currentQuestion === 1) {
        let {question, answers, correct, answered} = questions[0];
        theQuestion.textContent = "1. " + question;

        answers.forEach(item => {
            const answerbtn = document.createElement("button");
            answerbtn.classList.add("answer-btn");
            answerbtn.textContent = item;

            answerbtn.addEventListener("click", () => {
                if (answered) {
                    return;
                }

                questions[0].answered = true;

                if (item === correct) {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("correct-answer");
                    currentScore++;
                } else {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("wrong-answer");
                }

                const allbtn = document.querySelectorAll(".answer-btn");
                
                allbtn.forEach (button => {
                    button.disabled = true;
                });
            });

            theAnswer.append(answerbtn);
        });
    } else if (currentQuestion === 2) {
        let {question, answers, correct, answered} = questions[1];
        theQuestion.textContent = "2. " + question;

        answers.forEach(item => {
            const answerbtn = document.createElement("button");
            answerbtn.classList.add("answer-btn");
            answerbtn.textContent = item;

            answerbtn.addEventListener("click", () => {
                if (answered) {
                    return;
                }

                questions[1].answered = true;

                if (item === correct) {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("correct-answer");
                    currentScore++;
                } else {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("wrong-answer");
                }

                const allbtn = document.querySelectorAll(".answer-btn");
                
                allbtn.forEach (button => {
                    button.disabled = true;
                });
            });

            theAnswer.append(answerbtn);
        });
    } else if (currentQuestion === 3) {
        let {question, answers, correct, answered} = questions[2];
        theQuestion.textContent = "3. " + question;

        answers.forEach(item => {
            const answerbtn = document.createElement("button");
            answerbtn.classList.add("answer-btn");
            answerbtn.textContent = item;

            answerbtn.addEventListener("click", () => {
                if (answered) {
                    return;
                }

                questions[2].answered = true;

                if (item === correct) {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("correct-answer");
                    currentScore++;
                } else {
                    answerbtn.classList.remove("answer-btn");
                    answerbtn.classList.add("wrong-answer");
                }

                const allbtn = document.querySelectorAll(".answer-btn");
                
                allbtn.forEach (button => {
                    button.disabled = true;
                });
            });

            theAnswer.append(answerbtn);
        });
    }
}

nextbtn.addEventListener("click", () => {
    let checking = currentQuestion - 1;
    if (!questions[checking].answered) 
    {
        checkQuestion.style.display = "block";
        return;
    }
    currentQuestion++;
    
    theQuestion.innerHTML = "";
    theAnswer.innerHTML = "";

    renderQuestion();

    if (currentQuestion > 3) {
        theQuestion.remove();
        theAnswer.remove();
        nextbtn.remove();

        score.innerHTML = `<span style="font-weight: 700;">Your Score: </span> ${currentScore}`; 
    }
});

renderQuestion();

</script>

</body>
</html>
